<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Thực đơn - Cá Viên Chiên</title>

    <link
            rel="stylesheet"
            href="/admin/css/admin.css"
    >

    <style>
        /* =========================
           MENU
        ========================= */

        .hero.compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 15px;
        }

        .product {
            border: 1px solid #e8ecf2;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
        }

        .product-img {
            height: 170px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-icon {
            font-size: 48px;
        }

        .product-body {
            padding: 14px;
        }

        .product-body h3 {
            margin: 0 0 7px;
            font-size: 16px;
        }

        .product-body p {
            margin: 0 0 12px;
            min-height: 36px;
            font-size: 12px;
            color: #64748b;
        }

        .product-price {
            display: block;
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
        }

        .primary-btn,
        .secondary-btn,
        .danger-btn {
            height: 40px;
            border: 0;
            border-radius: 9px;
            padding: 0 14px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .primary-btn {
            background: #111827;
            color: #fff;
        }

        .primary-btn:hover {
            background: #263244;
        }

        .secondary-btn {
            background: #eef2f7;
            color: #172033;
        }

        .secondary-btn:hover {
            background: #e2e8f0;
        }

        .danger-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .danger-btn:hover {
            background: #fecaca;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, .62);
            backdrop-filter: blur(5px);
        }

        .modal-backdrop.hidden {
            display: none;
        }

        .modal {
            width: min(520px, 100%);
            max-height: calc(100vh - 40px);
            overflow-y: auto;

            background: #fff;
            border-radius: 20px;
            padding: 26px;

            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 3px 0 0;
            font-size: 22px;
        }

        .modal-close {
            width: 40px;
            height: 40px;

            border: 0;
            border-radius: 11px;

            background: #f1f5f9;

            font-size: 23px;
            cursor: pointer;
        }

        .modal-close:hover {
            background: #e2e8f0;
        }

        #productForm {
            display: grid;
            gap: 9px;
        }

        #productForm label {
            margin-top: 8px;
            font-weight: 700;
            color: #172033;
        }

        #productForm label span {
            color: #dc2626;
        }

        #productForm input[type="text"],
        #productForm input[type="number"],
        #productForm textarea {
            width: 100%;
            box-sizing: border-box;

            border: 1px solid #d7dee9;
            border-radius: 11px;

            padding: 12px 13px;

            font: inherit;
            outline: none;
        }

        #productForm input:focus,
        #productForm textarea:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, .12);
        }

        #productForm textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* =========================
           CHỌN ẢNH
        ========================= */

        .image-upload {
            border: 2px dashed #d7dee9;
            border-radius: 14px;
            padding: 14px;
            background: #f8fafc;
        }

        .image-upload input[type="file"] {
            width: 100%;
            cursor: pointer;
            font: inherit;
        }

        .image-help {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .image-preview {
            display: none;

            width: 100%;
            height: 180px;

            margin-top: 12px;

            border-radius: 12px;
            border: 1px solid #e2e8f0;

            object-fit: cover;
            background: #f1f5f9;
        }

        .image-preview.show {
            display: block;
        }

        .current-image {
            margin-top: 8px;
            color: #64748b;
            font-size: 12px;
        }

        .form-message {
            min-height: 20px;
            margin-top: 5px;

            color: #dc2626;
            font-size: 13px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-actions button {
            min-width: 110px;
        }

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero.compact {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero.compact .primary-btn {
                width: 100%;
            }
        }

        @media (max-width: 520px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 18px;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }

            .modal-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <a
            class="brand"
            href="/admin/index.html"
    >

        <span class="logo">
            🍢
        </span>

        <span>
            <b>Cá Viên Chiên</b>

            <small>
                Quản trị hệ thống
            </small>
        </span>

    </a>


    <nav>

        <a href="/admin/index.html">
            📊 Tổng quan
        </a>

        <a href="/admin/don-hang.html">
            🧾 Đơn hàng
        </a>

        <a
                class="active"
                href="/admin/thuc-don.html"
        >
            🍽️ Thực đơn
        </a>

        <a href="/admin/ban.html">
            🪑 Bàn
        </a>

    </nav>


    <button
            id="refreshBtn"
            class="icon-btn"
            type="button"
            title="Làm mới"
    >
        ↻
    </button>


    <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
    >
        Đăng xuất
    </button>

</header>


<main class="page">

    <section class="hero compact">

        <div>

            <p class="eyebrow">
                MENU
            </p>

            <h1>
                Thực đơn
            </h1>

            <p class="muted">
                Quản lý tên món, giá bán, mô tả và hình ảnh.
            </p>

        </div>


        <button
                id="addProductBtn"
                class="primary-btn"
                type="button"
        >
            ➕ Thêm món
        </button>

    </section>


    <section class="panel">

        <div class="filters">

            <input
                    id="search"
                    type="text"
                    placeholder="Tìm tên món..."
                    autocomplete="off"
            >

            <span
                    id="count"
                    class="muted"
            >
            </span>

        </div>


        <div
                id="message"
                class="message"
        >
            Đang tải...
        </div>


        <div
                id="products"
                class="product-grid"
        ></div>

    </section>

</main>


<!-- =========================
     MODAL THÊM / SỬA
========================= -->

<div
        id="productModal"
        class="modal-backdrop hidden"
        aria-hidden="true"
>

    <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="productModalTitle"
    >

        <div class="modal-header">

            <div>

                <p class="eyebrow">
                    MENU
                </p>

                <h2 id="productModalTitle">
                    Thêm món
                </h2>

            </div>


            <button
                    id="closeProductModalBtn"
                    class="modal-close"
                    type="button"
                    aria-label="Đóng"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                    id="productId"
                    type="hidden"
            >


            <label for="productName">
                Tên món <span>*</span>
            </label>

            <input
                    id="productName"
                    type="text"
                    maxlength="150"
                    required
                    placeholder="Ví dụ: Cá viên chiên"
            >


            <label for="productPrice">
                Giá bán <span>*</span>
            </label>

            <input
                    id="productPrice"
                    type="number"
                    min="0"
                    step="1000"
                    required
                    placeholder="12000"
            >


            <label for="productDescription">
                Mô tả
            </label>

            <textarea
                    id="productDescription"
                    rows="4"
                    maxlength="1000"
                    placeholder="Mô tả ngắn về món ăn..."
            ></textarea>


            <label for="productImageFile">
                Hình ảnh
            </label>

            <div class="image-upload">

                <input
                        id="productImageFile"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                >

                <div class="image-help">
                    📷 Chọn ảnh từ máy để xem trước.
                    <br>
                    Ảnh sử dụng thực tế phải được đặt trong
                    <b>src/main/resources/static/images/</b>.
                </div>


                <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Xem trước ảnh"
                >


                <div
                        id="currentImage"
                        class="current-image"
                ></div>

            </div>


            <div
                    id="formMessage"
                    class="form-message"
            ></div>


            <div class="modal-actions">

                <button
                        id="cancelProductBtn"
                        class="secondary-btn"
                        type="button"
                >
                    Hủy
                </button>


                <button
                        id="saveProductBtn"
                        class="primary-btn"
                        type="submit"
                >
                    💾 Lưu món
                </button>

            </div>

        </form>

    </div>

</div>

<script src="/admin/js/menu.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
