<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bàn - Cá Viên Chiên</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<header class="topbar">
    <a class="brand" href="/admin/index.html">
        <span class="logo">🍢</span>
        <span>
            <b>Cá Viên Chiên</b>
            <small>Quản trị hệ thống</small>
        </span>
    </a>

    <nav>
        <a href="/admin/index.html">📊 Tổng quan</a>
        <a href="/admin/don-hang.html">🧾 Đơn hàng</a>
        <a href="/admin/thuc-don.html">🍽️ Thực đơn</a>
        <a class="active" href="/admin/ban.html">🪑 Bàn</a>
    </nav>

    <div class="header-actions">
        <a
                href="/admin/tai-khoan.html"
                class="account-btn"
        >
            👤 Quản lý tài khoản
        </a>
        <button id="logoutBtn" class="logout-btn">Đăng xuất</button>
    </div>
</header>

<main class="page">
    <section class="hero">
        <div>
            <p class="eyebrow">QUẢN LÝ BÀN</p>
            <h1>Danh sách bàn</h1>
            <p class="muted">Quản lý trạng thái và mã QR của các bàn.</p>
        </div>
    </section>

    <div style="margin-bottom: 20px; text-align: right;">
        <button
                onclick="changeTableCount()"
                style="padding: 10px 16px; border: none; border-radius: 8px;
               background: #111; color: white; cursor: pointer;">
            Thay đổi số lượng bàn
        </button>
    </div>
    <div id="message" class="message">Đang tải danh sách bàn...</div>
    <div id="tables" class="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/admin/js/ban.js"></script>
<script src="/js/auth.js"></script>\n</body>
</html>
