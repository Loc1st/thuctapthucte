<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/staff/css/staff.css">

    <title>Quản lý bàn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* =====================================================
           STAFF HEADER
           ===================================================== */

        .staff-header {
            width: 100%;
            min-height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 24px;

            background: #111;
            color: #fff;
        }

        .staff-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .staff-logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #fff;
            color: #111;

            font-size: 22px;
            flex-shrink: 0;
        }

        .staff-brand h1 {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
        }

        .staff-brand span {
            display: block;
            margin-top: 2px;

            color: #bbb;
            font-size: 12px;
        }

        .staff-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .staff-nav a,
        .staff-nav button {
            min-height: 40px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 14px;

            border: 0;
            border-radius: 8px;

            color: #fff;
            background: transparent;

            text-decoration: none;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            transition: .15s;
        }

        .staff-nav a:hover,
        .staff-nav a.active {
            background: #fff;
            color: #111;
        }

        .staff-nav button {
            background: #fff;
            color: #111;
        }

        .staff-nav button:hover {
            opacity: .85;
        }


        /* =====================================================
           CONTENT
           ===================================================== */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns:
            repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;

            box-shadow:
                    0 2px 10px rgba(0, 0, 0, .08);
        }

        .table-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;

            padding: 6px 12px;
            margin-bottom: 15px;

            border-radius: 20px;

            font-size: 14px;
        }

        .empty {
            background: #dff5e3;
            color: #187a2f;
        }

        .busy {
            background: #ffe0e0;
            color: #b42318;
        }

        .qr-code {
            width: 180px;
            height: 180px;

            display: block;
            margin: 10px auto 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;

            padding: 10px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            background: #111;
            color: #fff;
        }

        .buttons button:hover {
            opacity: .85;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #666;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 768px) {

            .staff-header {
                min-height: auto;

                padding: 10px 12px;

                flex-direction: column;
                align-items: stretch;

                gap: 10px;
            }

            .staff-brand {
                justify-content: center;
            }

            .staff-logo {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .staff-brand h1 {
                font-size: 17px;
            }

            .staff-brand span {
                font-size: 11px;
            }

            .staff-nav {
                width: 100%;

                display: grid;
                grid-template-columns: repeat(4, 1fr);

                gap: 6px;
            }

            .staff-nav a,
            .staff-nav button {
                width: 100%;
                min-height: 38px;

                padding: 0 4px;

                font-size: 11px;
                white-space: nowrap;
            }

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .table-card {
                padding: 16px;
            }

            .table-name {
                font-size: 18px;
            }

            .qr-code {
                width: 160px;
                height: 160px;
            }
        }


        /* =====================================================
           ĐIỆN THOẠI NHỎ
           ===================================================== */

        @media (max-width: 420px) {

            .staff-header {
                padding: 9px 8px;
            }

            .staff-brand {
                gap: 8px;
            }

            .staff-logo {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .staff-brand h1 {
                font-size: 16px;
            }

            .staff-brand span {
                font-size: 10px;
            }

            .staff-nav {
                gap: 4px;
            }

            .staff-nav a,
            .staff-nav button {
                min-height: 36px;
                font-size: 10px;
                padding: 0 2px;
            }

            .container {
                padding: 0 8px;
            }
        }
    </style>
</head>

<body>

<header class="staff-header">

    <div class="staff-brand">

        <div class="staff-logo">
            🍢
        </div>

        <div>
            <h1>Cá Viên Chiên</h1>
            <span>Khu vực nhân viên</span>
        </div>

    </div>

    <nav class="staff-nav">

        <a href="/staff/index.html">
            🪑 Bàn
        </a>

        <a href="/admin/ban.html" class="active">
            📋 Đơn hàng
        </a>

        <a href="/admin/index.html">
            ⚙️ Quản lý
        </a>

        <button id="refreshBtn">
            ↻ Làm mới
        </button>

    </nav>

</header>

<main class="container">

    <div id="message" class="message">
        Đang tải danh sách bàn...
    </div>

    <div id="tables" class="grid"></div>

</main>


<!-- QUAN TRỌNG: SockJS phải load trước ban.js -->

<!-- QUAN TRỌNG: STOMP phải load trước ban.js -->
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- JS quản lý bàn -->
<script src="/admin/js/ban.js"></script>

</body>
</html>
