<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý bàn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .table-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .empty {
            background: #dff5e3;
            color: #187a2f;
        }

        .busy {
            background: #ffe0e0;
            color: #b42318;
        }

        .qr-code {
            width: 180px;
            height: 180px;
            display: block;
            margin: 10px auto 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #111;
            color: white;
        }

        button:hover {
            opacity: .85;
        }

        .message {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Quản lý bàn</h1>

    <a href="/admin/index.html">
        ← Quản lý đơn hàng
    </a>
</header>

<div class="container">

    <div id="message" class="message">
        Đang tải danh sách bàn...
    </div>

    <div id="tables" class="grid"></div>

</div>


<!-- QUAN TRỌNG: SockJS phải load trước ban.js -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<!-- QUAN TRỌNG: STOMP phải load trước ban.js -->
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- JS quản lý bàn -->
<script src="/admin/js/ban.js"></script>

</body>
</html>
