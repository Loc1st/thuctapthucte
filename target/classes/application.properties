spring.application.name=cavienchien-backend

# Database: dùng DB quangbaamthuc hiện tại
spring.datasource.url=jdbc:mysql://localhost:3306/quangbaamthuc?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Giai đoạn đầu: KHÔNG để Hibernate tự sửa DB cũ
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
